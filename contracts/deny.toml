[advisories]
# Both are "unmaintained" notices (not vulnerabilities) for crates pulled in
# transitively by soroban-sdk -> soroban-env-host -> ark-* (BLS12-381 support).
# There is no upgrade path from our side; revisit when soroban-sdk drops them.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; transitive via soroban-env-host/ark-*" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via soroban-env-host/ark-* and wasmi" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"

[[bans.skip]]
name = "darling"
version = "0.20.11"

[[bans.skip]]
name = "darling_core"
version = "0.20.11"

[[bans.skip]]
name = "syn"
version = "1.0.109"